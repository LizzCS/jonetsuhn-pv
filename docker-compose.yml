services:
  postgres:
    image: postgres:16-alpine
    container_name: jonetsudb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adminjonetsu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Jonetsu2024}
      POSTGRES_DB: ${POSTGRES_DB:-JonetsuDB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-adminjonetsu} -d ${POSTGRES_DB:-JonetsuDB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
